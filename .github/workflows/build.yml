name: Build AUR Packages

on:
  schedule:
    - cron: '0 4 * * *' # Runs every day at 4:00 AM UTC
  workflow_dispatch:   # Allows manual trigger via GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged # Required for certain pacman operations

    steps:
    - name: Initialize Arch Linux build environment
      run: |        
        # Install base-devel, git, and github-cli to manage releases
        pacman -Syu --noconfirm --needed base-devel git github-cli curl jq
        useradd -m builder
        echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
        
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Set Workspace Permissions
      run: |
        git config --global --add safe.directory '*'
        chown -R builder:builder ./

    - name: Build Packages
      shell: bash
      env:
        WORKSPACE_DIR: ${{ github.workspace }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p /tmp/builds
        chown -R builder:builder /tmp/builds
        cd /tmp/builds

        sudo -u builder env WORKSPACE_DIR="$WORKSPACE_DIR" GITHUB_TOKEN="$GITHUB_TOKEN" GH_REPO="$GITHUB_REPOSITORY" bash << 'EOF'
        PACKAGES=("google-chrome" "anydesk-bin" "visual-studio-code-bin" "yay-bin" "python312")

        EXISTING_ASSETS=$(gh release view repository --json assets --jq '.assets[].name' 2>/dev/null || true)

        for pkg in "${PACKAGES[@]}"; do
          echo "========================================="
          echo "Checking package: $pkg"
          echo "========================================="

          # Query AUR API for the current version without cloning
          AUR_VERSION=$(curl -s "https://aur.archlinux.org/rpc/v5/info?arg[]=${pkg}" | jq -r '.results[0].Version // empty')

          if [ -z "$AUR_VERSION" ]; then
            echo "Could not fetch version for $pkg from AUR API. Skipping."
            continue
          fi

          # Skip if any asset matching this package name and version already exists
          if echo "$EXISTING_ASSETS" | grep -qF "${pkg}-${AUR_VERSION}-"; then
            echo "Package $pkg ${AUR_VERSION} is already in the release. Skipping."
            continue
          fi

          echo "Package $pkg ${AUR_VERSION} not found in release. Compiling..."
          git clone "https://aur.archlinux.org/${pkg}.git"
          cd "${pkg}"
          makepkg -s --noconfirm --needed

          if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
            cp *.pkg.tar.zst "$WORKSPACE_DIR/"
          else
            echo "Error: Build failed for $pkg"
            exit 1
          fi

          cd ..
        done
        EOF

    - name: Update Pacman Repository Database
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download repository -p "custom_repo.db.tar.zst" || echo "No existing database found. Creating a fresh one."
        
        if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
          repo-add custom_repo.db.tar.zst *.pkg.tar.zst
        fi
        
        if [ -f custom_repo.db.tar.zst ]; then
          rm -f custom_repo.db
          cp custom_repo.db.tar.zst custom_repo.db
        else
          echo "Error: Database metadata is missing."
          exit 1
        fi

    - name: Deploy Compiled Repo to GitHub Releases
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view repository &>/dev/null; then
          gh release edit repository --notes "Updated on $(date +'%Y-%m-%d')"
        else
          gh release create repository --title "Automated AUR Repository" --notes "Updated on $(date +'%Y-%m-%d')" --target main
        fi

        # Only upload package binaries if new ones were actually compiled
        if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
          gh release upload repository *.pkg.tar.zst --clobber
        fi

        # Always upload the updated database files
        if [ -f custom_repo.db.tar.zst ]; then
          gh release upload repository custom_repo.db.tar.zst --clobber
        fi
        if [ -f custom_repo.db ]; then
          gh release upload repository custom_repo.db --clobber
        fi
